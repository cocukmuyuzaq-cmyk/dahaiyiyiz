const S=(b)=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function K(pwd,salt){
  const e=new TextEncoder();
  const bk=await crypto.subtle.importKey('raw',e.encode(pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
}
document.getElementById('f').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const m=document.getElementById('m');
  m.textContent='Kontrol ediliyor...';
  try{
    const o=JSON.parse(D);
    const key=await K(document.getElementById('p').value,S(o.s));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:S(o.i)},key,S(o.c));
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(err){
    m.textContent='Şifre yanlış!';
  }
});
